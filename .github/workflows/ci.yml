name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # SQLite sources need DuckDB's sqlite extension, which is a download. Install it
      # here so the SQLite test runs in CI instead of skipping.
      - name: Install DuckDB sqlite extension
        run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL sqlite')"

      - name: Test
        run: uv run pytest
        env:
          GOLDTABLE_REQUIRE_SQLITE: "1"
