[project]
name = "goldtable"
version = "0.0.0"
description = "Snapshot testing for data pipeline outputs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Afzal Farooqui", email = "for.afzal.xyz@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
goldtable = "goldtable.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldtable"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
"src/goldtable/cli.py" = ["B008"]  # typer declares options as default arguments

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: large-file tests, run with `uv run pytest -m slow`"]

[tool.uv]
# OneDrive-synced folders reject hardlinks from the uv cache (os error 396).
link-mode = "copy"
